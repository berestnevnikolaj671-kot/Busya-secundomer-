<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Busya™ Секундомер</title>
    
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --accent: #007AFF;
            --accent-hover: #005bb5;
            --danger: #ef4444;
            --border-color: #e5e7eb;
            --modal-bg: rgba(0, 0, 0, 0.4);
        }

        [data-theme="dark"] {
            --bg-color: #111827;
            --card-bg: #1f2937;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
            --accent: #0A84FF;
            --accent-hover: #409cff;
            --danger: #ff453a;
            --border-color: #374151;
            --modal-bg: rgba(0, 0, 0, 0.7);
        }

        [data-theme="blue"] {
            --bg-color: #0b192c;
            --card-bg: #112b4e;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #7dd3fc;
            --danger: #fb7185;
            --border-color: #1e3a8a;
            --modal-bg: rgba(2, 6, 23, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }

        header {
            padding: 20px;
            position: relative;
            height: 70px;
        }

        .settings-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            z-index: 10;
        }

        body.lefty-mode .settings-btn {
            right: auto;
            left: 20px;
        }

        .settings-btn:active { transform: scale(0.95); }
        .settings-btn svg { width: 24px; height: 24px; fill: currentColor; }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 30px;
            min-height: 80px;
        }

        .input-section label {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-main);
            font-weight: bold;
        }

        .input-row input {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-main);
            font-size: 16px;
            font-weight: bold;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s, opacity 0.3s;
        }
        
        .input-row input:focus { border-color: var(--accent); }
        .input-row input.small { width: 65px; }
        .input-row input.large { width: 120px; font-size: 20px; }

        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 14px;
            color: var(--text-main);
            font-weight: 500;
            margin-top: 12px;
            user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .display-container {
            position: relative;
            width: 280px;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        .digital-display {
            font-size: 42px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: -1px;
            white-space: nowrap;
        }

        .circular-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
            display: none;
        }

        .progress-ring-bg { fill: none; stroke: var(--border-color); stroke-width: 6; }
        .progress-ring-circle {
            fill: none; stroke: var(--accent); stroke-width: 8;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.1s linear;
        }

        [data-style="round"] .circular-svg { display: block; }
        [data-style="digital"] .display-container { height: auto; margin-bottom: 60px; }
        [data-style="digital"] .digital-display { font-size: 64px; }

        .controls {
            display: flex;
            gap: 15px;
            width: 100%;
            justify-content: center;
        }

        .btn {
            border: none;
            padding: 16px 32px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 24px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
            color: #fff;
            min-width: 120px;
        }
        
        .btn:active { transform: scale(0.95); }
        .btn-start { background-color: var(--accent); }
        .btn-stop { background-color: var(--danger); display: none; }
        .btn-reset { background-color: var(--text-muted); }

        footer {
            padding: 30px 20px;
            text-align: center;
            font-size: 11px;
            color: var(--text-muted);
            line-height: 1.6;
        }
        
        .footer-brand {
            font-weight: bold;
            font-size: 13px;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--modal-bg);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100; backdrop-filter: blur(5px);
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--card-bg); width: 90%; max-width: 400px;
            border-radius: 24px; padding: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transform: translateY(20px); transition: transform 0.3s ease;
            max-height: 90vh; overflow-y: auto;
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .modal-header h2 { font-size: 20px; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 28px; cursor: pointer; line-height: 1; }

        .setting-item { margin-bottom: 20px; }
        .setting-item label {
            display: block; font-size: 13px; color: var(--text-muted);
            margin-bottom: 8px; font-weight: 600; text-transform: uppercase;
        }

        .setting-select, .github-link-box {
            width: 100%; padding: 12px 16px; border-radius: 12px;
            border: 1px solid var(--border-color); background: var(--bg-color);
            color: var(--text-main); font-size: 16px; outline: none; font-family: inherit;
        }

        .toggle-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 0; border-bottom: 1px solid var(--border-color);
        }
        .toggle-row span { font-weight: 500; }

        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color); transition: .3s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 20px; width: 20px; left: 4px; bottom: 4px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(22px); }

        .github-link-box {
            display: block; text-align: center; text-decoration: none;
            background: var(--border-color); margin-top: 10px; font-weight: 500; font-size: 14px;
        }

        [dir="rtl"] .settings-btn { left: 20px; right: auto; }
        body.lefty-mode[dir="rtl"] .settings-btn { right: 20px; left: auto; }
        [dir="rtl"] .modal-header h2 { text-align: right; width: 100%; }
        [dir="rtl"] .close-btn { position: absolute; left: 24px; }
        [dir="rtl"] .setting-item label, [dir="rtl"] .toggle-row span { text-align: right; }
        [dir="rtl"] .input-row { flex-direction: row-reverse; }
    </style>
</head>

<body data-theme="light" data-style="round" data-mode="stopwatch" dir="ltr">

    <main>

        <div class="input-section" id="stopwatch-inputs">
            <label id="lbl_loop_time">Цикл (по умолчанию 60с)</label>

                <input type="number" class="small" id="sw-sec" min="0" placeholder="Сек" value="60"> :

            <label class="checkbox-label">
                <input type="checkbox" id="sw-infinite"> <span id="lbl_infinite">Бессрочно</span>

        </div>

        <!-- Таймер Настройки -->
        <div class="input-section" id="timer-inputs" style="display: none;">

        <div class="display-container">

    <div class="modal-overlay" id="settings-modal">
        <div class="modal-content">

                <h2 id="modal_title">Настройки</h2>
                <button class="close-btn" id="close-settings">&times;</button>
            </div>

            <div class="setting-item">
                <label id="lbl_lang">Язык / Language</label>
                <select class="setting-select" id="sel_lang">
                    <option value="ru">Русский</option>

                </select>
            </div>

            <div class="setting-item">
                <label id="lbl_theme">Тема оформления</label>
                <select class="setting-select" id="sel_theme">
                    <option value="light" id="opt_light">Светлая</option>
                    <option value="dark" id="opt_dark">Черная</option>
                    <option value="blue" id="opt_blue">Синяя</option>
                </select>
            </div>

            <div class="setting-item">
                <label id="lbl_mode">Режим работы</label>
                <select class="setting-select" id="sel_mode">

                    <option value="timer" id="opt_timer">Таймер</option>
                </select>
            </div>

            <div class="setting-item">
                <label id="lbl_style">Стиль</label>

                <a href="https://github.com/berestnevnikolaj671-kot/Busya-secundomer-/tree/main" target="_blank" rel="noopener noreferrer" class="github-link-box" id="lbl_github_btn">

    <script>
        const body = document.body;
        const timeDisplay = document.getElementById('time-display');
        const progressRing = document.getElementById('progress-ring');
        
        // Mode specific inputs
        const stopwatchInputs = document.getElementById('stopwatch-inputs');
        const swMinInput = document.getElementById('sw-min');
        const swSecInput = document.getElementById('sw-sec');
        const swMsInput = document.getElementById('sw-ms');
        const swInfiniteChk = document.getElementById('sw-infinite');
        
        const timerInputs = document.getElementById('timer-inputs');
        const timeInput = document.getElementById('time-input');
        
        // Buttons
        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const btnReset = document.getElementById('btn-reset');
        
        // Modal & Selects
        const modal = document.getElementById('settings-modal');
        const selLang = document.getElementById('sel_lang');
        const selTheme = document.getElementById('sel_theme');
        const selMode = document.getElementById('sel_mode');
        const selStyle = document.getElementById('sel_style');
        const chkLefty = document.getElementById('chk_lefty');

        // Ring Setup (r=90, circumference = 2 * pi * 90 = 565.48)
        const radius = progressRing.r.baseVal.value;
        const circumference = radius * 2 * Math.PI;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = 0;

        let animationFrameId;
        let startTime = 0;
        let elapsedMs = 0;
        let isRunning = false;
        let loopTimeMs = 60000; // 60s default
        let targetTimerMs = 60000;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playBeep() {
            if (!audioCtx) initAudio();
            // Three loud short beeps pattern
            for (let i = 0; i < 3; i++) {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime + (i * 0.4)); 
                
                gain.gain.setValueAtTime(1, audioCtx.currentTime + (i * 0.4));
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + (i * 0.4) + 0.3);
                
                osc.start(audioCtx.currentTime + (i * 0.4));
                osc.stop(audioCtx.currentTime + (i * 0.4) + 0.3);
            }
        }

        function formatTime(ms) {
            const m = Math.floor(ms / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            const c = Math.floor((ms % 1000) / 10);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}.${c.toString().padStart(2, '0')}`;
        }

        function updateDisplay() {
            const mode = selMode.value;
            timeDisplay.textContent = formatTime(elapsedMs);
            
            let progress = 0;
            if (mode === 'stopwatch') {
                if (swInfiniteChk.checked) {
                    // Visual loop every 60s in infinite mode
                    progress = (elapsedMs % 60000) / 60000;
                } else {
                    progress = loopTimeMs > 0 ? (elapsedMs / loopTimeMs) : 0;
                }
            } else {
                progress = targetTimerMs > 0 ? (elapsedMs / targetTimerMs) : 0;
                progress = 1 - progress; // Timer counts down visually
            }
            
            progress = Math.max(0, Math.min(1, progress));
            progressRing.style.strokeDashoffset = circumference - (progress * circumference);
        }

        function tick() {
            if (!isRunning) return;
            const now = Date.now();
            const mode = selMode.value;
            
            if (mode === 'stopwatch') {
                elapsedMs = now - startTime;
                
                if (!swInfiniteChk.checked && loopTimeMs > 0) {
                    if (elapsedMs >= loopTimeMs) {
                        playBeep();
                        startTime = now; // Loop it
                        elapsedMs = 0;
                    }
                }
            } else { // timer
                elapsedMs = targetTimerMs - (now - startTime);
                if (elapsedMs <= 0) {
                    elapsedMs = 0;
                    stopTimer();
                    playBeep();
                }
            }
            
            updateDisplay();
            animationFrameId = requestAnimationFrame(tick);
        }

        function startTimer() {
            if (isRunning) return;
            initAudio(); // Initialize audio on user interaction
            
            const mode = selMode.value;
            
            if (mode === 'stopwatch') {
                const m = parseInt(swMinInput.value) || 0;
                const s = parseInt(swSecInput.value) || 0;
                const ms = parseInt(swMsInput.value) || 0;
                loopTimeMs = (m * 60000) + (s * 1000) + ms;
                if (loopTimeMs <= 0) loopTimeMs = 60000;
                
                startTime = Date.now() - elapsedMs;
            } else {
                if (elapsedMs === 0 || elapsedMs === targetTimerMs) {
                    let val = parseInt(timeInput.value) || 60;
                    targetTimerMs = val * 1000;
                    elapsedMs = targetTimerMs;
                }
                startTime = Date.now() - (targetTimerMs - elapsedMs);
            }

            // Hide inputs while running
            stopwatchInputs.style.opacity = '0'; stopwatchInputs.style.pointerEvents = 'none';
            timerInputs.style.opacity = '0'; timerInputs.style.pointerEvents = 'none';
            
            btnStart.style.display = 'none';
            btnStop.style.display = 'block';
            
            isRunning = true;
            animationFrameId = requestAnimationFrame(tick);
        }

        function stopTimer() {
            if (!isRunning) return;
            isRunning = false;
            cancelAnimationFrame(animationFrameId);
            
            btnStart.style.display = 'block';
            btnStop.style.display = 'none';
            
            // Show inputs
            stopwatchInputs.style.opacity = '1'; stopwatchInputs.style.pointerEvents = 'auto';
            timerInputs.style.opacity = '1'; timerInputs.style.pointerEvents = 'auto';
            
            const mode = selMode.value;
            if (mode === 'stopwatch' && swInfiniteChk.checked) {
                playBeep(); // Beep on manual stop if infinite
            }
        }

        function resetTimer() {
            stopTimer();
            if (selMode.value === 'stopwatch') {
                elapsedMs = 0;
            } else {
                let val = parseInt(timeInput.value) || 60;
                targetTimerMs = val * 1000;
                elapsedMs = targetTimerMs;
            }
            updateDisplay();
        }

        btnStart.addEventListener('click', startTimer);
        btnStop.addEventListener('click', stopTimer);
        btnReset.addEventListener('click', resetTimer);

        swInfiniteChk.addEventListener('change', (e) => {
            const disabled = e.target.checked;
            swMinInput.disabled = disabled;
            swSecInput.disabled = disabled;
            swMsInput.disabled = disabled;
            [swMinInput, swSecInput, swMsInput].forEach(el => el.style.opacity = disabled ? '0.5' : '1');
        });

        const dict = {
            ru: {
                title: "Busya™ Секундомер",
                lbl_loop_time: "Цикл (по умолчанию 60с)",
                lbl_infinite: "Бессрочно", ph_min: "Мин", ph_sec: "Сек", ph_ms: "Мс",
                lbl_input: "Задать таймер (в секундах)",
                btn_start: "Старт", btn_stop: "Стоп", btn_reset: "Сброс",
                modal_title: "Настройки", lbl_lang: "Язык",
                lbl_theme: "Тема оформления", opt_light: "Светлая", opt_dark: "Черная", opt_blue: "Синяя",
                lbl_mode: "Режим работы", opt_stopwatch: "Секундомер", opt_timer: "Таймер",
                lbl_style: "Стиль", opt_round: "Круглый", opt_digital: "Цифровой",

        function applySettings() {
            body.setAttribute('data-theme', selTheme.value);
            body.setAttribute('data-style', selStyle.value);
            
            if (chkLefty.checked) body.classList.add('lefty-mode');
            else body.classList.remove('lefty-mode');

            if (selMode.value === 'stopwatch') {
                stopwatchInputs.style.display = 'flex';
                timerInputs.style.display = 'none';
            } else {
                stopwatchInputs.style.display = 'none';
                timerInputs.style.display = 'flex';
            }
            
            const langData = dict[selLang.value] || dict['ru'];
            document.title = langData.title;
            document.getElementById('lbl_loop_time').textContent = langData.lbl_loop_time;
            document.getElementById('lbl_infinite').textContent = langData.lbl_infinite;
            swMinInput.placeholder = langData.ph_min;
            swSecInput.placeholder = langData.ph_sec;
            swMsInput.placeholder = langData.ph_ms;
            document.getElementById('lbl_input').textContent = langData.lbl_input;
            btnStart.textContent = langData.btn_start;
            btnStop.textContent = langData.btn_stop;
            btnReset.textContent = langData.btn_reset;
            document.getElementById('modal_title').textContent = langData.modal_title;
            document.getElementById('lbl_lang').textContent = langData.lbl_lang;
            document.getElementById('lbl_theme').textContent = langData.lbl_theme;
            document.getElementById('opt_light').textContent = langData.opt_light;
            document.getElementById('opt_dark').textContent = langData.opt_dark;
            document.getElementById('opt_blue').textContent = langData.opt_blue;
            document.getElementById('lbl_mode').textContent = langData.lbl_mode;
            document.getElementById('opt_stopwatch').textContent = langData.opt_stopwatch;
            document.getElementById('opt_timer').textContent = langData.opt_timer;
            document.getElementById('lbl_style').textContent = langData.lbl_style;
            document.getElementById('opt_round').textContent = langData.opt_round;
            document.getElementById('opt_digital').textContent = langData.opt_digital;
            document.getElementById('lbl_lefty').textContent = langData.lbl_lefty;
            document.getElementById('lbl_github_btn').textContent = langData.lbl_github_btn;
            document.getElementById('legal_1').textContent = langData.legal_1;
            document.getElementById('legal_2').textContent = langData.legal_2;

            body.setAttribute('dir', selLang.value === 'ar' ? 'rtl' : 'ltr');
            
            if (!isRunning) resetTimer();
        }

        document.getElementById('open-settings').addEventListener('click', () => modal.classList.add('active'));
        document.getElementById('close-settings').addEventListener('click', () => modal.classList.remove('active'));
        
        [selLang, selTheme, selMode, selStyle, chkLefty].forEach(el => {
            el.addEventListener('change', applySettings);
        });

        // Initialize
        applySettings();
    </script>
